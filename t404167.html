로움으로 번질 수도 있어.", "stat": "경제적 독립이 강한 사람일수록 관계 스트레스 회복 탄력성이 높지만, 친밀감 표현은 적다는 분석이 있어"}}, "bridge": "이 유형, 사실 몸 컨디션이랑도 은근 연결돼 있대. 궁금하면 다음 것도 해봐.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t404167", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;
