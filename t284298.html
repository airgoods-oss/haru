 "bridge": "근데 이거, 마음만의 문제가 아니라 요즘 부쩍 무겁고 잘 안 빠지는 내 몸 상태랑도 은근히 이어져 있더라고.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t284298", "next_label": "내 몸은 지금 괜찮나? 30초 체크"};var Q=D.questions,T=D.results;
