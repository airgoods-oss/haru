var D={"questions": [{"q": "밥때 놓친 채로 장바구니를 열었다. 손이 먼저 하는 짓은?", "a": [["일단 다 담고 결제부터 누른다", "A"], ["귀찮아서 창 닫고 '나중에'로 미룬다", "D"], ["가격 보고 짜증나서 다 취소한다", "C"]]}, {"q": "공복에 누가 애매한 부탁을 한다. 첫 반응은?", "a": [["에라 모르겠다, 그냥 오케이", "A"], ["일단 반려. 확실하지 않으면 노", "B"], ["왜 하필 지금이냐고 톡 쏜다", "C"]]}, {"q": "저녁 안 먹고 '접을까 버틸까' 고민 중. 넌?", "a": [["감정 올라와서 극단으로 지른다", "C"], ["결정 자체를 내일로 넘긴다", "D"], ["일단 다 접는 쪽으로 컷", "B"]]}, {"q": "허기질 때 메뉴 고르는 방식은?", "a": [["보이는 거 아무거나 바로 찍는다", "A"], ["못 고르고 남한테 떠넘긴다", "D"], ["다 별로라 결국 안 먹는다", "B"]]}, {"q": "혈당 바닥일 때 카톡 답장 톤은?", "a": [["묻지도 따지지도 않고 다 수락", "A"], ["단답·거절 위주로 방어", "B"], ["평소보다 날 서고 예민", "C"]]}], "results": {"A": {"emoji": "🌀", "name": "공복 폭주 승인형", "tag": "배고프면 다 예스", "desc": "허기지면 판단 문턱이 확 낮아져서 지름·수락·결제가 술술 나가는 타입. 에너지 아끼려는 뇌가 '깊게 생각하기'를 건너뛰는 거야.", "stat": "의사결정 피로가 쌓이면 '기본값 수락' 확률이 뛴다", "tips": ["큰 결정은 뭐라도 먹고 30분 뒤에", "공복엔 장바구니는 담기만, 결제는 식후에"]}, "B": {"emoji": "🧊", "name": "공복 전면 반려형", "tag": "애매하면 일단 노", "desc": "혈당 떨어지면 판사가 다 반려하듯, 조금이라도 불확실하면 거절부터 눌러 방어하는 타입. 안전하지만 좋은 기회도 같이 컷당해.", "stat": "자기통제 자원이 줄면 '거절이 안전'하다는 편향이 세진다", "tips": ["'노'가 튀어나오면 한 끼 뒤 다시 판단", "거절 전에 '지금 배고픈가?' 한 번 체크"]}, "C": {"emoji": "🔥", "name": "저혈당 욱발진형", "tag": "행그리 결정러", "desc": "배고프면 감정이 먼저 튀어서 판단이 극단으로 쏠리는 타입. 'hangry(hungry+angry)'는 실제로 관찰되는 현상이야.", "stat": "혈당이 낮을수록 짜증·충동 반응이 강해진다는 보고가 있다", "tips": ["예민한 답장은 밥 먹고 다시 읽기", "욱하면 전송 대신 초안함에 저장"]}, "D": {"emoji": "😶", "name": "에너지 방전 보류형", "tag": "판단을 미룬다", "desc": "기력 떨어지면 결정 자체를 뒤로 미뤄버리는 타입. 뇌가 에너지 없을 땐 '판단 안 하기'가 제일 편하거든.", "stat": "결정 피로가 쌓이면 선택을 회피·연기하는 경향이 커진다", "tips": ["미룰 땐 '언제 다시 볼지' 시간만 정해두기", "가벼운 간식 후 5분 타이머 걸고 결정"]}}, "bridge": "근데 이 '허기 판단 버릇', 사실 네 요즘 몸 컨디션이랑도 은근 맞물려 있거든?", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t128516", "next_label": "그럼 내 몸 상태는?"};var Q=D.questions,T=D.results;

Object.keys(T).forEach(function(k){sc[k]=0});

$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};

$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
var qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";qt.textContent=q.q;
var box=$("opts");box.innerHTML="";
q.a.forEach(function(pair,ai){var t=pair[0],k=pair[1];
var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
var choose=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});
b.classList.add("sel");if(sc[k]===undefined)sc[k]=0;sc[k]++;hist.push({key:k,ai:ai});
setTimeout(function(){idx++;idx<Q.length?render(-1):judge()},220)};

b.addEventListener("touchmove",function(e){var t=e.changedTouches[0];if(Math.abs(t.clientX-tx)>12||Math.abs(t.clientY-ty)>12)tmoved=true},{passive:true});

function judge(){$("quiz").classList.add("hidden");$("judging").classList.remove("hidden");$("bar").style.width="100%";

var iv=setInterval(function(){si++;if(si<steps.length){$("jtext").textContent=steps[si]}else{clearInterval(iv);show()}},540)}
