var D={"questions": [{"q": "밤 11시, 장바구니에 뭔가 담겨 있어. 손이 먼저 하는 건?", "a": [["일단 결제 누르고 '내일의 나'한테 맡긴다", "A"], ["창 닫고 폰 엎어놓고 눕는다", "B"], ["가격·후기 30분 더 뒤진다", "C"]]}, {"q": "하루 중 언제 '나 왜 이걸 골랐지' 싶은 결정을 제일 많이 해?", "a": [["밤 늦게, 피곤이 몰려올 때", "A"], ["딱히 없음, 웬만하면 안 산다", "B"], ["결정 자체를 계속 미룬다", "C"]]}, {"q": "피곤할 때 메뉴 고르라고 하면?", "a": [["'아무거나' 하고 남한테 던진다", "A"], ["안 먹고 만다", "B"], ["끝까지 고민하다 결국 늘 먹던 거", "C"]]}, {"q": "충동적으로 뭔가 저지른 다음 날 아침 기분은?", "a": [["어제의 나 왜 그랬냐며 후회", "A"], ["애초에 저지를 게 별로 없음", "B"], ["저지르지도 못하고 미룬 게 더 찜찜", "C"]]}, {"q": "자제력이 바닥났다고 느끼는 순간은?", "a": [["밤에 '몰라 그냥' 소리가 절로 나올 때", "A"], ["오히려 밤에 더 절제 스위치가 켜짐", "B"], ["결정을 미루고 미루다 지쳐버릴 때", "C"]]}], "results": {"A": {"emoji": "🌀", "name": "밤의 방전형", "tag": "낮의 이성 vs 밤의 '몰라 그냥'", "desc": "넌 결정피로에 제일 솔직한 타입이야. 하루 종일 참고 골라온 뇌가 밤엔 완전 방전돼서 '몰라 그냥 사' 모드로 넘어가지. 나쁜 게 아니라 뇌가 원래 그렇게 설계돼 있어.", "stat": "충동 결제의 상당수가 밤 시간대에 몰린다는 건 결정피로로 설명돼", "tips": ["장바구니에 담으면 '결제'는 무조건 다음 날 아침으로", "밤 결정이 필요하면 미리 정해둔 규칙에 맡겨(고민 자체를 줄이기)"]}, "B": {"emoji": "🛡️", "name": "방어 스위치형", "tag": "밤엔 오히려 문을 닫는다", "desc": "넌 방전 신호가 오면 아예 판을 접어버리는 타입이야. 피곤할수록 결정을 안 하는 쪽으로 튼튼하게 방어하지. 충동엔 강하지만, 가끔은 필요한 것까지 미루기도 해.", "stat": "'결정 회피'도 자아고갈을 아끼는 유효한 뇌 전략 중 하나", "tips": ["미룬 것 중 진짜 필요한 건 낮에 컨디션 좋을 때 몰아서 결정", "다 막지 말고 '이건 오늘 통과' 하나쯤 허락도 해봐"]}, "C": {"emoji": "⏳", "name": "무한 저울형", "tag": "방전될 때까지 고민한다", "desc": "넌 지를 용기도, 접을 결단도 미룬 채 저울질만 계속하는 타입이야. 결정을 안 내리는 것도 에너지를 쓰는 일이라, 정작 방전은 네가 제일 심하게 겪을 수 있어.", "stat": "'결정을 미루는 상태' 자체가 뇌 자원을 계속 갉아먹는다는 게 결정피로의 핵심", "tips": ["작은 결정엔 '3분 룰' — 시간 지나면 그냥 결정", "고민 항목을 아침으로 몰아 뇌가 팔팔할 때 한 번에 처리"]}, "D": {"emoji": "🎢", "name": "양극 스윙형", "tag": "낮엔 철벽, 밤엔 붕괴", "desc": "넌 낮엔 누구보다 절제하다가 밤에 한 방에 무너지는 진폭 큰 타입이야. 참았던 자제력이 방전되며 반동으로 확 터지는 거라, 하루 안에서도 두 사람처럼 오가.", "stat": "낮에 자제력을 몰아 쓰면 밤에 반동이 커진다는 게 자아고갈의 전형적 패턴"}}, "bridge": "이 유형, 사실 몸 컨디션이랑도 은근 연결돼 있대. 궁금하면 다음 것도 해봐.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t294650", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};
var idx=0,sc={},lock=false,hist=[];
Object.keys(T).forEach(function(k){sc[k]=0});
$("start").onclick=function(){idx=0;hist=[];Object.keys(T).forEach(function(k){sc[k]=0});
$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
$("back").onclick=function(){if(idx<=0||lock)return;idx--;var p=hist.pop();if(p)sc[p.key]--;render(p?p.ai:-1)};
function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;
$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
var qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";qt.textContent=q.q;

var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
var choose=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});

setTimeout(function(){idx++;idx<Q.length?render(-1):judge()},220)};

b.addEventListener("touchmove",function(e){var t=e.changedTouches[0];if(Math.abs(t.clientX-tx)>12||Math.abs(t.clientY-ty)>12)tmoved=true},{passive:true});

function judge(){$("quiz").classList.add("hidden");$("judging").classList.remove("hidden");$("bar").style.width="100%";

var iv=setInterval(function(){si++;if(si<steps.length){$("jtext").textContent=steps[si]}else{clearInterval(iv);show()}},540)}
function show(){var code=Object.keys(sc).reduce(function(a,b){return sc[a]>=sc[b]?a:b});
