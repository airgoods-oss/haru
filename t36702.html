이 상상 스위치가 켜지는 빈도는, 요즘 네 몸 컨디션·쌓인 스트레스랑도 은근히 맞물려 있대.", "next": "https://airgoods-oss.github.io/haru/body_sleep.html?nt_source=threads&nt_medium=social&nt_detail=t36702", "next_label": "내 몸·스트레스 유형은? 30초 체크"};var Q=D.questions,T=D.results;

$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
