<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>내 오후 졸음·카페인 타입</title><meta property="og:title" content="오후 2시, 왜 이렇게 졸릴까? 내 카페인 타입 테스트"><meta property="og:description" content="오후 졸음이 몰려오는 순간 내 몸이 반응하는 방식, 5문항으로 알아봐"><meta property="og:image" content="https://airgoods-oss.github.io/haru/og_t231294.png"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><style>@font-face{font-family:'Pretendard';src:url('Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}

footer{color:var(--faint);font-size:11px;line-height:1.7;margin:26px 0 20px;text-align:center}</style></head><body><div class="app"><div id="intro" class="scr"><div class="eyebrow"><span class="dot"></span>AI 심리 분석소</div><h1>오후 2시, 눈꺼풀 무너지는 거 게을러서 아님<br><span class="g">한 잔의 커피가 밤잠 훔쳐가는 타입인지 지금 확인</span></h1><p class="desc">오후에 졸리는 건 체온이 살짝 떨어지는 자연스러운 리듬이야. 근데 여기서 뭘 마시고 뭘 하냐가 밤잠을 가른다. 내 몸은 어떤 타입일까?</p><div class="src">📎 <b>근거</b> · 카페인 반감기 5~6시간·오후 체온저하 졸음은 수면생리학의 실제 개념</div><div class="meta"><div class="pill"><b>4</b><span>유형</span></div><div class="pill"><b>5</b><span>문항</span></div><div class="pill"><b>30초</b><span>소요</span></div></div><button class="cta" id="start">내 유형 확인하기</button><p class="fine">심리 이론 기반 · 재미로 보는 해석 · 진단 아님</p></div><div id="quiz" class="scr hidden"><div class="qhead"><button id="back" class="backbtn hidden">← 이전</button><span class="qcount">Q<b id="qn">1</b> / 5</span></div><div class="prog"><i id="bar"></i></div><p class="q" id="qtext"></p><div class="opts" id="opts"></div></div><div id="judging" class="scr hidden"><div class="judge"><div class="spinner"></div><div class="jtext" id="jtext">분석 중…</div></div></div><div id="result" class="scr hidden"></div></div><script>
var D={"questions": [{"q": "오후 2~3시, 졸음이 확 몰려오면 제일 먼저?", "a": [["일단 커피부터 한 잔 때린다", "A"], ["잠깐 눈 감거나 스트레칭", "B"], ["당 떨어졌나 싶어 단 거", "C"]]}, {"q": "하루에 커피(카페인) 몇 잔쯤?", "a": [["3잔 이상, 물처럼 마심", "A"], ["1~2잔, 아침에만", "B"], ["거의 안 마셔도 버틴다", "C"]]}, {"q": "저녁 이후 커피 마시면?", "a": [["마셔도 잘만 잔다고 믿음", "A"], ["찜찜해서 웬만하면 피함", "B"], ["마시면 확실히 밤에 말똥말똥", "C"]]}, {"q": "밤에 눕고 나서 잠들기까지?", "a": [["30분 넘게 뒤척일 때 많음", "A"], ["눕자마자 금방 잠", "B"], ["그날그날 복불복", "C"]]}, {"q": "낮잠에 대한 내 스타일은?", "a": [["10~20분 자면 확실히 개운", "B"], ["자면 오히려 더 멍함", "A"], ["잘 시간도 상황도 안 됨", "C"]]}], "results": {"A": {"emoji": "☕", "name": "카페인 부메랑형", "tag": "낮의 한 잔이 밤에 돌아옴", "desc": "졸리면 일단 커피로 밀어붙이는 타입. 근데 오후에 마신 카페인의 3분의 1이 잘 시간까지 몸에 남아 밤잠을 갉아먹고 있을 확률이 높아.", "stat": "카페인 반감기 5~6시간, 오후 3시 한 잔이 밤 9시에도 절반 남음", "tips": ["오후 2시 이후엔 디카페인이나 따뜻한 무카페인 음료로 갈아타 보기", "졸릴 땐 커피 대신 물 한 컵+5분 걷기부터"]}, "B": {"emoji": "🌿", "name": "리듬 순응형", "tag": "몸의 신호대로 사는 타입", "desc": "졸리면 억지로 밀어붙이지 않고 짧게 쉬며 넘기는 타입. 카페인도 아침에만 챙겨서 밤잠을 지키는 편, 몸이 보내는 신호를 잘 읽고 있어.", "stat": "10~20분 짧은 낮잠은 오후 각성도를 실제로 올려준다", "tips": ["지금 리듬 유지하되 낮잠은 20분 넘기지 않기", "오후 햇빛 5분 쬐면 졸음 리듬이 더 또렷해짐"]}, "C": {"emoji": "🎢", "name": "혈당 롤러코스터형", "tag": "졸음의 범인이 커피가 아닐 수도", "desc": "졸리면 단 걸 찾는 타입. 급하게 올린 혈당이 다시 뚝 떨어지면서 오히려 더 무거운 졸음이 오는 악순환일 수 있어.", "stat": "단순당 섭취 후 혈당 급등락은 식후 졸음(post-lunch dip)을 키운다", "tips": ["단 간식 대신 견과·단백질로 혈당 완만하게", "점심을 과식하지 않으면 오후 졸음이 눈에 띄게 준다"]}, "D": {"emoji": "🌙", "name": "수면빚 누적형", "tag": "오후 졸음이 밤 부족의 청구서", "desc": "밤에 충분히 못 자서 낮에 그 빚을 몰아 받는 타입. 오후 졸음이 카페인이나 혈당보다 '어젯밤 수면 시간' 문제일 가능성이 커.", "stat": "수면 부족은 다음 날 오후 졸음 강도를 가장 크게 올리는 요인"}}, "bridge": "이 유형, 사실 몸 컨디션이랑도 은근 연결돼 있대. 궁금하면 다음 것도 해봐.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t231294", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};
var idx=0,sc={},lock=false,hist=[];
Object.keys(T).forEach(function(k){sc[k]=0});
$("start").onclick=function(){idx=0;hist=[];Object.keys(T).forEach(function(k){sc[k]=0});
$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
$("back").onclick=function(){if(idx<=0||lock)return;idx--;var p=hist.pop();if(p)sc[p.key]--;render(p?p.ai:-1)};
function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;
$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
var qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";qt.textContent=q.q;
var box=$("opts");box.innerHTML="";
q.a.forEach(function(pair,ai){var t=pair[0],k=pair[1];
var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
var choose=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});
b.classList.add("sel");if(sc[k]===undefined)sc[k]=0;sc[k]++;hist.push({key:k,ai:ai});
setTimeout(function(){idx++;idx<Q.length?render(-1):judge()},220)};
var tx,ty,tmoved;
b.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tmoved=false},{passive:true});
b.addEventListener("touchmove",function(e){var t=e.changedTouches[0];if(Math.abs(t.clientX-tx)>12||Math.abs(t.clientY-ty)>12)tmoved=true},{passive:true});
b.addEventListener("touchend",function(e){if(!tmoved){e.preventDefault();choose()}});
b.addEventListener("click",function(){if(tx==null)choose()});box.appendChild(b)})}
function judge(){$("quiz").classList.add("hidden");$("judging").classList.remove("hidden");$("bar").style.width="100%";
var steps=["증상 접수 중…","심리 이론 대조 중…","패턴 매칭 중…","맞춤 리포트 작성 중…"];var si=0;$("jtext").textContent=steps[0];
var iv=setInterval(function(){si++;if(si<steps.length){$("jtext").textContent=steps[si]}else{clearInterval(iv);show()}},540)}
function show(){var code=Object.keys(sc).reduce(function(a,b){return sc[a]>=sc[b]?a:b});
var t=T[code]||T[Object.keys(T)[0]];
var tipHtml=(t.tips||[]).map(function(x){return '<div class="li">'+x+'</div>'}).join("");
$("result").innerHTML='<div class="rwrap"><div class="rcard"><div class="rin">'
+'<div class="remoji">'+(t.emoji||"🔎")+'</div><div class="rtype">YOUR TYPE</div>'
+'<div class="rname"><span class="em">'+t.name+'</span></div>'
+'<div class="rbase">'+(t.tag||"")+'</div><div class="rdesc">'+t.desc+'</div>'
+(t.stat?'<div class="src" style="margin-top:14px">'+t.stat+'</div>':'')
+'</div></div><div class="hint">📸 내 유형 맞으면 캡처해서 공유</div>'
+(tipHtml?'<div class="sec"><h3>💡 이 유형, 이렇게</h3>'+tipHtml+'</div>':'')
+'<div class="social"><div class="top">🔗 근데 이거 알아?</div>'
+'<div class="sub" style="margin-top:8px">'+D.bridge+'</div></div>'
+'<div class="btns"><a class="gbtn pri" href="'+D.next+'">'+D.next_label+' →</a>'
+'<button class="gbtn sec2" onclick="location.reload()">다시 하기</button></div>'
+'<footer>근거: 심리 이론 기반 해석 · 의학 진단 아님 · 결과 저장 안 됨</footer></div>';
$("judging").classList.add("hidden");$("result").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
</script></body></html>
