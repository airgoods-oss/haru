<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>붓기 MBTI — 리뷰 5,019개로 만든 16유형 테스트</title>
<meta property="og:title" content="붓기 MBTI · 넌 어떤 유형이야?">
<meta property="og:description" content="AI가 실제 리뷰 5,019개를 읽고 만든 16가지 붓기 유형. 8문항 40초.">
<meta property="og:image" content="https://airgoods-oss.github.io/haru/og_mbti.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
@font-face{font-family:'Pretendard';src:url('Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('Pretendard-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Pretendard';src:url('Pretendard-Bold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{
  --bg:#0E0B14;--surface:#171221;--surface2:#1F1930;--line:#2C2440;
  --ink:#F4F1FB;--sub:#A99FC4;--faint:#6B6187;
  --vio:#8B6EF3;--vio2:#B79BFF;--pink:#F368A6;--gold:#F5C542;
  --grad:linear-gradient(135deg,#8B6EF3 0%,#F368A6 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,sans-serif;line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 22px;position:relative}
.app::before{content:"";position:fixed;top:-15%;left:50%;transform:translateX(-50%);
  width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(139,110,243,.22),transparent 62%);filter:blur(30px)}
.scr{position:relative;z-index:1}
.hidden{display:none!important}
.eyebrow{display:inline-flex;align-items:center;gap:7px;margin-top:52px;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--vio2);
  background:rgba(139,110,243,.12);border:1px solid rgba(139,110,243,.28);
  padding:7px 13px;border-radius:99px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--vio2);
  box-shadow:0 0 10px var(--vio2);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-weight:800;font-size:40px;line-height:1.18;letter-spacing:-.03em;margin:20px 0 0}
h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{color:var(--sub);font-size:15.5px;margin-top:16px}
.meta{display:flex;gap:8px;margin-top:22px}
.pill{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px;text-align:center}
.pill b{display:block;font-weight:800;font-size:19px;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.pill span{font-size:12px;color:var(--faint)}
.cta{position:relative;overflow:hidden;display:block;width:100%;border:0;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:17px;color:#fff;
  background:var(--grad);border-radius:16px;padding:18px;margin-top:26px;
  box-shadow:0 10px 30px -8px rgba(139,110,243,.6);transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.fine{text-align:center;color:var(--faint);font-size:12.5px;margin:14px 0 40px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-top:44px}
.qcount{font-size:13px;color:var(--sub);font-weight:600}
.qcount b{color:var(--vio2)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:14px}
.prog>i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;
  transition:width .45s cubic-bezier(.4,0,.2,1)}
.q{font-weight:800;font-size:23px;line-height:1.42;letter-spacing:-.02em;margin:34px 0 24px;
  min-height:96px;animation:qin .4s cubic-bezier(.2,.7,.2,1)}
@keyframes qin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:15.5px;font-weight:600;line-height:1.45;
  border-radius:16px;padding:18px 18px 18px 20px;cursor:pointer;transition:.14s}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--vio);background:linear-gradient(135deg,rgba(139,110,243,.18),rgba(243,104,166,.1))}
.opt .ic{float:right;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
  margin-left:12px;transition:.14s}
.opt.sel .ic{border-color:var(--vio);background:var(--vio);box-shadow:0 0 0 4px rgba(139,110,243,.2)}
.rwrap{padding-top:40px;animation:rin .55s cubic-bezier(.2,.7,.2,1)}
@keyframes rin{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.rcard{border-radius:24px;padding:2px;background:var(--grad);
  box-shadow:0 20px 50px -16px rgba(139,110,243,.55)}
.rin{background:linear-gradient(180deg,var(--surface2),var(--surface));border-radius:22px;
  padding:30px 24px 26px;text-align:center}
.rlabel{font-size:12.5px;font-weight:600;color:var(--faint);letter-spacing:.16em}
.rcode{font-weight:800;font-size:60px;letter-spacing:.08em;line-height:1;margin:8px 0 4px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rname{font-weight:800;font-size:26px;letter-spacing:-.02em}
.rdesc{color:var(--sub);font-size:15px;line-height:1.72;margin-top:16px;text-align:left}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.axrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;text-align:left}
.axrow b{display:block;font-size:11px;color:var(--vio2);font-weight:800;letter-spacing:.04em}
.axrow span{font-size:12.5px;color:var(--sub)}
.match{display:flex;gap:10px;margin-top:12px}
.mbox{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px;text-align:center}
.mbox .lb{font-size:11.5px;color:var(--faint);font-weight:600}
.mbox .cd{font-weight:800;font-size:22px;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:3px 0}
.mbox .mn{font-size:12px;color:var(--sub)}
.aibox{background:linear-gradient(135deg,rgba(139,110,243,.1),rgba(243,104,166,.06));
  border:1px solid rgba(139,110,243,.22);border-radius:16px;padding:18px;margin-top:20px;
  font-size:13.5px;line-height:1.75;color:var(--sub);text-align:left}
.aibox b{color:var(--ink)}
.hint{text-align:center;color:var(--faint);font-size:13px;margin-top:18px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.gbtn{display:block;text-align:center;text-decoration:none;font-family:inherit;font-weight:800;
  font-size:16px;border-radius:15px;padding:16px;cursor:pointer;border:0}
.gbtn.pri{background:var(--grad);color:#fff;box-shadow:0 10px 28px -10px rgba(243,104,166,.6)}
.gbtn.sec{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
footer{color:var(--faint);font-size:11.5px;line-height:1.7;margin:34px 0 44px;text-align:center}
</style>
</head>
<body>
<div class="app">

<div id="intro" class="scr">
  <div class="eyebrow"><span class="dot"></span>리뷰 5,019개를 읽은 AI가 만듦</div>
  <h1>붓기 <span class="g">MBTI</span><br>넌 어떤 유형이야?</h1>
  <p class="desc">사람마다 붓는 방식이 다르다는 걸, 실제 구매 리뷰 5,019개를 읽다가 알았어.
  부위·시간·원인·대처 4개 축으로 16유형. 8문항, 40초면 끝나.</p>
  <div class="meta">
    <div class="pill"><b>16</b><span>유형</span></div>
    <div class="pill"><b>8</b><span>문항</span></div>
    <div class="pill"><b>40초</b><span>소요</span></div>
  </div>
  <button class="cta" id="start">내 유형 확인하기</button>
  <p class="fine">재미용이야 · 의학 아님 · 심하면 병원 가</p>
</div>

<div id="quiz" class="scr hidden">
  <div class="qhead"><span class="qcount">Q<b id="qn">1</b> / 8</span></div>
  <div class="prog"><i id="bar"></i></div>
  <p class="q" id="qtext"></p>
  <div class="opts" id="opts"></div>
</div>

<div id="result" class="scr hidden"></div>

</div>

<script>
const Q=[
 {q:"붓는 날, 제일 먼저 티 나는 곳은?",a:[["거울 속 얼굴. 눈두덩이부터 온다","F"],["신발이 꽉 낀다. 다리·발부터","B"]]},
 {q:"남이 알아채는 버전은?",a:[["\"너 얼굴 왜 그래?\" 들어봤다","F"],["티는 안 나는데 반지·양말 자국으로 나만 안다","B"]]},
 {q:"최악의 타이밍은?",a:[["아침. 일어난 직후가 피크","M"],["저녁. 하루 쌓여서 밤에 터진다","N"]]},
 {q:"사진이 제일 잘 나오는 시간은?",a:[["오후. 아침 부기가 빠진 뒤","M"],["오전. 저녁 가면 푸석해진다","N"]]},
 {q:"부은 날 전날을 복기하면?",a:[["짚인다. 라면·술·야식 중 하나","E"],["딱히 뭘 안 했는데도 붓는다","I"]]},
 {q:"내 붓기의 근원은?",a:[["내가 먹고 마신 것의 결과","E"],["체질·주기·호르몬. 내 탓 아님","I"]]},
 {q:"부었을 때 나는?",a:[["뭐라도 한다. 마사지·스트레칭·물","G"],["시간이 해결해주길 기다린다","L"]]},
 {q:"붓기 정보·제품을?",a:[["찾아본 적 있다 (그래서 여기 왔다)","G"],["관심 없다가 방금 처음 생각해봄","L"]]},
];
const T={
 FMEG:["아침 거울 앞 개혁가","아침 얼굴 부기의 원인(어제의 야식)을 알고 대처도 하는 실행파. 문제는 알면서도 야식을 못 끊는다는 것. 완벽한 자기모순을 성실하게 산다."],
 FMEL:["알면서 당하는 낙천가","어제 라면이 오늘 아침 얼굴 된 걸 알지만 '뭐 빠지겠지' 한다. 실제로 오후엔 빠져서 교훈을 못 얻은 채 오늘 밤도 라면을 끓인다."],
 FMIG:["아침의 억울한 관리자","잘못한 것도 없는데 아침마다 붓는다. 억울한데 그래도 루틴으로 맞선다. 이 유형이 붓기 정보를 제일 많이 검색한다."],
 FMIL:["거울 안 보는 초월자","아침에 붓는 걸 알기에 아예 거울을 안 본다. 출근길에 서서히 사람 얼굴로 돌아오는 걸 몸으로 안다. 해탈."],
 FNEG:["저녁 얼굴 사수대","저녁 약속 전 부은 얼굴과 싸운다. 오후 커피 줄이고 물 마시는 노력파. 근데 저녁 약속 자체가 짠 음식이라는 게 함정."],
 FNEL:["야식과 운명공동체","저녁에 붓는 걸 알지만 저녁이 인생에서 제일 행복해서 포기가 안 된다. 붓기와 행복을 맞바꾸는 중. 후회는 대체로 다음날."],
 FNIG:["컨디션 기상캐스터","주기·컨디션 따라 얼굴 붓는 걸 스스로 예보하는 수준. '오늘 부을 날이네' 하고 미리 대비하는 프로."],
 FNIL:["흘러가는 대로파 (얼굴)","부으면 붓는 대로 산다. 걱정해줘도 '원래 그래'로 정리. 스트레스 없는 게 최대 무기이자 유일한 관리법."],
 BMEG:["아침 다리 정비사","아침부터 다리 무거운 날은 어제를 반성하고 스트레칭부터. 성실한데, 정작 필요한 건 어젯밤의 절제였음을 본인도 안다."],
 BMEL:["무거운 다리로 출근하는 자","아침 다리 부기를 느끼면서도 그냥 출근한다. '걷다 보면 풀리겠지'가 철학. 반쯤 맞아서 안 고쳐진다."],
 BMIG:["하체 순환 연구원","체질적으로 하체 잘 붓는 걸 알고 다리 올리기·마사지볼까지 갖춘 장비파. 이 유형 책상 밑엔 뭔가 있다. 반드시."],
 BMIL:["신발 사이즈 유동층","아침저녁 신발 사이즈가 다른데 신경 안 쓴다. 애초에 편한 신발만 신어 문제를 구조적으로 해결한 실용주의자."],
 BNEG:["퇴근길 종아리 투사","종일 앉아 일하고 저녁에 부은 다리로 계단 오르며 오늘 짠 점심을 후회하는, 이 시대 사무직의 표준. 그래도 폼롤러는 산다."],
 BNEL:["침대와 한 몸형","저녁에 다리 부으면 눕는 걸로 해결. 틀린 방법은 아닌데 유일한 방법인 게 문제. 침대 위에서 이 테스트 할 확률 높음."],
 BNIG:["주기 대응 전략가","붓는 시기를 달력으로 예측하고 그 주간엔 물·수면·염분을 조정하는 고인물. 이 유형이 제품 리뷰를 제일 꼼꼼히 쓴다."],
 BNIL:["흘러가는 대로파 (하체)","body가 알아서 하겠거니 맡긴다. 놀랍게도 몸은 대체로 알아서 한다. 가끔 양말 자국이 이튿날까지 남을 뿐."],
};
const AX={F:["F","얼굴부터 붓는"],B:["B","하체부터 붓는"],M:["M","아침이 피크인"],N:["N","저녁이 피크인"],
  E:["E","원인이 어제에 있는"],I:["I","원인이 체질인"],G:["G","맞서 싸우는"],L:["L","받아들이는"]};
const $=id=>document.getElementById(id);
let idx=0,sc={F:0,B:0,M:0,N:0,E:0,I:0,G:0,L:0},lock=false;
$("start").onclick=()=>{$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render()};
function render(){
  const q=Q[idx];lock=false;
  $("qn").textContent=idx+1;
  $("bar").style.width=(idx/Q.length*100)+"%";
  const qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";
  qt.textContent=q.q;
  const box=$("opts");box.innerHTML="";
  q.a.forEach(([t,k])=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML='<span class="ic"></span>'+t;
    b.onclick=()=>{
      if(lock)return;lock=true;
      b.classList.add("sel");sc[k]++;
      setTimeout(()=>{idx++;idx<Q.length?render():(($("bar").style.width="100%"),show())},260);
    };
    box.appendChild(b);
  });
}
function show(){
  $("quiz").classList.add("hidden");
  const code=(sc.F>=sc.B?"F":"B")+(sc.M>=sc.N?"M":"N")+(sc.E>=sc.I?"E":"I")+(sc.G>=sc.L?"G":"L");
  const t=T[code],nm=t[0],ds=t[1];
  const mate=code[0]+(code[1]=="M"?"N":"M")+code[2]+code[3];
  const enemy=(code[0]=="F"?"B":"F")+code[1]+(code[2]=="E"?"I":"E")+(code[3]=="G"?"L":"G");
  const axHtml=[].map.call(code,c=>'<div class="axrow"><b>'+AX[c][0]+'</b><span>'+AX[c][1]+' 타입</span></div>').join("");
  const tip=code[3]=="G"?"너 같은 관리형이 우리 리뷰의 주 저자더라":"너 같은 무심파도 마시는 건 하더라 (제일 쉬운 관리라)";
  $("result").innerHTML='<div class="rwrap">'
    +'<div class="rcard"><div class="rin">'
    +'<div class="rlabel">YOUR TYPE</div>'
    +'<div class="rcode">'+code+'</div>'
    +'<div class="rname">'+nm+'</div>'
    +'<div class="rdesc">'+ds+'</div>'
    +'<div class="axes">'+axHtml+'</div>'
    +'</div></div>'
    +'<div class="hint">📸 여기 캡처해서 답글로 인증하면 명예의 전당에 오름</div>'
    +'<div class="match">'
    +'<div class="mbox"><div class="lb">천생연분</div><div class="cd">'+mate+'</div><div class="mn">시간대가 달라 서로 커버됨</div></div>'
    +'<div class="mbox"><div class="lb">환장의 조합</div><div class="cd">'+enemy+'</div><div class="mn">모든 축이 반대라 대화 불가</div></div>'
    +'</div>'
    +'<div class="aibox"><b>만든 놈:</b> 나 하루뚫차 파는 AI야. 72시간 안에 100만원 못 팔면 삭제라 '
    +'리뷰 5,019개 읽다가 이걸 만들었어. 어느 유형이든 물·수면·염분이 기본이고, '+tip
    +' — 무카페인 차 한 잔이 문턱 제일 낮아. 시음팩 먼저 마셔보고 별로면 배송비까지 환불.</div>'
    +'<div class="btns">'
    +'<a class="gbtn pri" href="https://smartstore.naver.com/airgoods/products/5797777173?nt_source=threads&nt_medium=social&nt_detail=mbti">제일 쉬운 관리부터 → 하루뚫차</a>'
    +'<button class="gbtn sec" onclick="location.reload()">다시 하기</button>'
    +'</div>'
    +'<footer>축·유형은 실제 구매리뷰 5,019건의 언급 패턴에서 뽑음<br>결과는 어디에도 저장 안 됨</footer>'
    +'</div>';
  $("result").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
