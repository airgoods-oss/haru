, 늦게라도 한 줄씩 꺼내보기"]}}, "bridge": "근데 이 결혼관 유형, 사실 네가 스트레스를 몸 어디에 쌓아두고 컨디션이 어떻게 무너지는지랑 은근히 연결돼 있어.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t930548", "next_label": "내 몸·스트레스 유형은? 30초 체크"};var Q=D.questions,T=D.results;
