var D={"questions": [{"q": "요즘 우리 부부 잠자리 빈도는?", "a": [["주 2회 이상, 꾸준한 편", "A"], ["주 1회 정도", "B"], ["한 달 1~2번", "C"], ["기억이 가물가물", "D"]]}, {"q": "밤 분위기는 주로 누가 먼저 만들어?", "a": [["서로 자연스럽게", "A"], ["기분 좋은 날 내가", "B"], ["대부분 상대가", "C"], ["요즘은 아무도 안 만듦", "D"]]}, {"q": "하루 끝, 침대에 누우면 드는 생각은?", "a": [["오늘 좀 붙어볼까", "A"], ["피곤한데 분위기 되면", "B"], ["일단 자자, 내일도 바빠", "C"], ["폰 보다 잠듦", "D"]]}, {"q": "둘 중 컨디션이 밤을 좌우하는 정도는?", "a": [["컨디션 좋으면 확 달라짐", "A"], ["어느 정도 영향 받음", "B"], ["피곤하면 무조건 패스", "C"], ["늘 방전 상태라 잘 모름", "D"]]}, {"q": "밤 얘기, 서로 얼마나 편하게 해?", "a": [["뭐든 툭 터놓고 말함", "A"], ["필요할 땐 조심스레", "B"], ["거의 안 함, 눈치만", "C"], ["말 꺼낼 타이밍도 없음", "D"]]}, {"q": "주말 아침 둘의 그림은?", "a": [["느긋하게 붙어서 뒹굴", "A"], ["같이 있지만 각자 폰", "B"], ["한 명은 늦잠, 한 명은 볼일", "C"], ["애·집안일에 정신없음", "D"]]}], "results": {"A": {"emoji": "🔥", "name": "밀착 스킨십형", "tag": "찐친밀형 · 상위 12%", "desc": "둘 사이 온도가 아직 뜨끈한 부부. 빈도보다 '서로 붙고 싶은 마음'이 살아있다는 게 진짜 강점이야.", "stat": "스킨십 잦은 커플일수록 옥시토신 분비로 유대감·안정감이 높게 보고되는 경향이 있어.", "tips": ["지금 리듬 유지하려면 서로 컨디션 챙겨주기", "'오늘 좀 피곤해'도 솔직히 말하는 습관"]}, "B": {"emoji": "🌙", "name": "은근 밸런스형", "tag": "안정밸런스형 · 상위 34%", "desc": "불타진 않아도 필요할 땐 통하는 부부. 무난해 보여도 사실 대부분 부부가 부러워하는 안정 구간이야.", "stat": "빈도보다 '만족도'가 관계 행복을 더 잘 예측한다는 분석 결과가 여럿 있어.", "tips": ["가끔은 먼저 분위기 만들어보기", "피곤·스트레스 쌓이는 날 서로 알아채주기"]}, "C": {"emoji": "🛋️", "name": "룸메이트 전환형", "tag": "동거안정형 · 상위 58%", "desc": "편해진 만큼 밤은 뜸해진 부부. 사이가 나쁜 게 아니라, 일·피로·컨디션이 밤보다 앞줄에 선 상태야.", "stat": "피로·수면 부족·스트레스가 쌓이면 친밀 욕구가 눈에 띄게 줄어든다는 보고가 많아.", "tips": ["잠자리 얘기 대신 '요즘 컨디션 어때' 물어보기", "둘만의 시간 짧게라도 캘린더에 심기"]}, "D": {"emoji": "💤", "name": "각자 방전형", "tag": "소진형 · 상위 71%", "desc": "밤이 문제가 아니라, 둘 다 하루를 겨우 버티는 부부. 방전된 몸엔 마음 쓸 여유도 안 남는 게 당연해.", "stat": "만성 피로·붓기·스트레스가 겹치면 컨디션과 친밀 욕구가 함께 가라앉는 흐름이 흔해."}}, "bridge": "이 유형, 사실 몸 컨디션이랑도 은근 연결돼 있대. 궁금하면 다음 것도 해봐.", "next": "https://airgoods-oss.github.io/haru/body_sleep.html?nt_source=threads&nt_medium=social&nt_detail=t130944", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};

$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
$("back").onclick=function(){if(idx<=0||lock)return;idx--;var p=hist.pop();if(p)sc[p.key]--;render(p?p.ai:-1)};
function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;
$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
var qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";qt.textContent=q.q;
var box=$("opts");box.innerHTML="";
q.a.forEach(function(pair,ai){var t=pair[0],k=pair[1];
var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
var choose=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});
b.classList.add("sel");if(sc[k]===undefined)sc[k]=0;sc[k]++;hist.push({key:k,ai:ai});
setTimeout(function(){idx++;idx<Q.length?render(-1):judge()},220)};
var tx,ty,tmoved;

b.addEventListener("touchmove",function(e){var t=e.changedTouches[0];if(Math.abs(t.clientX-tx)>12||Math.abs(t.clientY-ty)>12)tmoved=true},{passive:true});

function judge(){$("quiz").classList.add("hidden");$("judging").classList.remove("hidden");$("bar").style.width="100%";
var steps=["증상 접수 중…","심리 이론 대조 중…","패턴 매칭 중…","맞춤 리포트 작성 중…"];var si=0;$("jtext").textContent=steps[0];

$("result").innerHTML='<div class="rwrap"><div class="rcard"><div class="rin">'
