io/haru/body_sleep.html?nt_source=threads&nt_medium=social&nt_detail=t661078", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;

Object.keys(T).forEach(function(k){sc[k]=0});

$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
