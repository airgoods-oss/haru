footer{color:var(--faint);font-size:11px;line-height:1.7;margin:26px 0 20px;text-align:center}</style></head><body><div class="app"><div id="intro" class="scr"><div class="eyebrow"><span class="dot"></span>AI 심리 분석소</div><h1>남편이랑 눈 마주친 시간, 하루에 몇 분이야?<br><span class="g">관심의 반대는 미움이 아니라 무관심이래. 지금 몇 %인지 재보자.</span></h1><p class="desc">성격이라 넘긴 그 무심함, 사실은 신호일 수도 있어. 6문항으로 우리 집 무관심 지수를 딱 재보자.</p><div class="src">📎 <b>근거</b> · 심리학에서 '관심의 반대는 미움이 아니라 무관심'(엘리 위젤)이라는 말은 정서적 단절의 위험 신호를 설명할 때 자주 인용돼.</div><div class="meta"><div class="pill"><b>4</b><span>유형</span></div><div class="pill"><b>6</b><span>문항</span></div><div class="pill"><b>30초</b><span>소요</span></div></div><button class="cta" id="start">내 유형 확인하기</button><p class="fine">심리 이론 기반 · 재미로 보는 해석 · 진단 아님</p></div><div id="quiz" class="scr hidden"><div class="qhead"><button id="back" class="backbtn hidden">← 이전</button><span class="qcount">Q<b id="qn">1</b> / 6</span></div><div class="prog"><i id="bar"></i></div><p class="q" id="qtext"></p><div class="opts" id="opts"></div></div><div id="judging" class="scr hidden"><div class="judge"><div class="spinner"></div><div class="jtext" id="jtext">분석 중…</div></div></div><div id="result" class="scr hidden"></div></div><script>
var D={"questions": [{"q": "하루에 남편이랑 진짜 눈 마주치고 대화하는 시간, 얼마나 돼?", "a": [["30분 이상, 그날 있었던 일 서로 나눠", "A"], ["10~20분 정도, 필요한 얘기는 함", "B"], ["5분 남짓, 용건만 짧게", "C"], ["거의 없음, 눈 마주친 게 언제였지", "D"]]}, {"q": "내가 대화 꺼내면 남편 반응은?", "a": [["하던 거 멈추고 들어줘", "A"], ["듣긴 하는데 건성건성", "B"], ["폰 보면서 어 어 대답만 해", "C"], ["방 들어가거나 자리 피해", "D"]]}, {"q": "내가 힘든 티를 냈을 때 남편은?", "a": [["먼저 무슨 일 있냐고 물어봐", "A"], ["말하면 그제야 알아차려", "B"], ["말해도 별 반응 없어", "C"], ["'네가 예민한 거야'라고 나를 문제 삼아", "D"]]}, {"q": "주말에 둘이 같이 보내는 시간은?", "a": [["뭐라도 같이 하려고 해", "A"], ["집에 같이 있긴 한데 각자", "B"], ["한 명은 자고 한 명은 폰", "C"], ["같은 공간인데 남남 같아", "D"]]}, {"q": "남편이 내 얘기를 기억하는 정도는?", "a": [["지나가듯 한 말도 기억해줘", "A"], ["중요한 건 기억함", "B"], ["몇 번 말해야 겨우", "C"], ["말해도 흘려들어서 기억 못 해", "D"]]}, {"q": "요즘 남편 옆에 있을 때 내 감정은?", "a": [["편하고 든든해", "A"], ["가끔 서운하지만 괜찮아", "B"], ["외롭고 혼자인 것 같아", "C"], ["같이 있어도 벽 보고 사는 느낌", "D"]]}], "results": {"A": {"emoji": "🟢", "name": "청정단계", "tag": "남편의 무관심·투명인간 취급 지수 5%", "desc": "서로 눈 맞추고 대화가 오가는 관계야. 지금의 이 연결감을 당연하게 여기지 않는 게 제일 큰 자산이다.", "stat": "부부의 정서적 반응성(상대 신호에 반응해주는 정도)이 높을수록 관계 만족도가 높다는 게 존 가트맨 연구의 핵심이야.", "tips": ["잘 되고 있으니 고맙다는 말 오늘 한 번 하기", "서로 눈 마주치는 5분을 루틴으로 지키기"]}, "B": {"emoji": "🟡", "name": "주의단계", "tag": "남편의 무관심·투명인간 취급 지수 30%", "desc": "큰 문제는 없지만 건성인 반응이 쌓이는 중이야. 지금 서운함을 삼키면 나중에 벽이 된다.", "stat": "작은 무시가 반복되면 감정이 조금씩 멀어지는 '정서적 철수'가 시작되는데, 초기엔 본인도 잘 못 느껴.", "tips": ["서운한 순간을 참지 말고 그날 바로 말하기", "'폰 내려놓고 3분만'처럼 구체적으로 요청하기"]}, "C": {"emoji": "🟠", "name": "경고단계", "tag": "남편의 무관심·투명인간 취급 지수 60%", "desc": "용건만 오가고 감정은 끊긴 상태야. 외롭다는 그 느낌, 예민한 게 아니라 실제 신호일 수 있어.", "stat": "대화를 꺼낼 때 상대가 자리를 피하는 '회피형' 패턴은 갈등이 아니라 친밀감 자체를 불편해하는 신호로 해석되곤 해.", "tips": ["비난 대신 '나는 외로워'처럼 내 감정으로 말하기", "반응 없는 이유를 혼자 단정 말고 직접 물어보기"]}, "D": {"emoji": "🔴", "name": "위험단계", "tag": "남편의 무관심·투명인간 취급 지수 85%", "desc": "같이 있어도 남남, 게다가 '네가 문제'라는 말까지 듣는 중이야. 무관심에 감정 뒤집기까지 겹치면 나를 지키는 게 먼저다.", "stat": "내가 느낀 감정을 '네가 예민한 거야'로 되돌리는 반응은 상대의 현실감각을 흔드는 정서적 패턴으로 지적되는 방식이야.", "tips": ["내 감정을 부정당했던 순간들 날짜로 기록해두기", "혼자 감당 말고 믿을 사람이나 전문 상담과 나누기"]}}, "bridge": "근데 마음이 이렇게 오래 눌려 있으면 몸이 먼저 티를 내더라 — 요즘 컨디션·붓기·피곤 이상하지 않아?", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t448073", "next_label": "내 몸은 지금 괜찮나? 30초 체크"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};
var idx=0,sc={},lock=false,hist=[];
Object.keys(T).forEach(function(k){sc[k]=0});
$("start").onclick=function(){idx=0;hist=[];Object.keys(T).forEach(function(k){sc[k]=0});
$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
$("back").onclick=function(){if(idx<=0||lock)return;idx--;var p=hist.pop();if(p)sc[p.key]--;render(p?p.ai:-1)};
function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;
$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
var qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";qt.textContent=q.q;
var box=$("opts");box.innerHTML="";
q.a.forEach(function(pair,ai){var t=pair[0],k=pair[1];
var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
var choose=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});
b.classList.add("sel");if(sc[k]===undefined)sc[k]=0;sc[k]++;hist.push({key:k,ai:ai});
setTimeout(function(){idx++;idx<Q.length?render(-1):judge()},220)};
var tx,ty,tmoved;
b.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tmoved=false},{passive:true});
b.addEventListener("touchmove",function(e){var t=e.changedTouches[0];if(Math.abs(t.clientX-tx)>12||Math.abs(t.clientY-ty)>12)tmoved=true},{passive:true});
b.addEventListener("touchend",function(e){if(!tmoved){e.preventDefault();choose()}});
b.addEventListener("click",function(){if(tx==null)choose()});box.appendChild(b)})}
function judge(){$("quiz").classList.add("hidden");$("judging").classList.remove("hidden");$("bar").style.width="100%";
var steps=["증상 접수 중…","심리 이론 대조 중…","패턴 매칭 중…","맞춤 리포트 작성 중…"];var si=0;$("jtext").textContent=steps[0];
var iv=setInterval(function(){si++;if(si<steps.length){$("jtext").textContent=steps[si]}else{clearInterval(iv);show()}},540)}
