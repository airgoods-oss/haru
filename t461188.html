<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>오늘 나는 몇 번이나 표면 연기 했을까</title><meta property="og:title" content="표면 연기 지수 테스트"><meta property="og:description" content="안 웃긴데 지은 표정, 그거 다 표정값이래. 오늘 내 감정노동 몇 칸까지 찼는지 5문항으로 확인해봐."><meta property="og:image" content="https://airgoods-oss.github.io/haru/og_t461188.png"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><style>@font-face{font-family:'Pretendard';src:url('Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}

footer{color:var(--faint);font-size:11px;line-height:1.7;margin:26px 0 20px;text-align:center}</style></head><body><div class="app"><div id="intro" class="scr"><div class="eyebrow"><span class="dot"></span>AI 심리 분석소</div><h1>안 웃긴데 웃은 표정, 그거 다 값이 매겨져<br><span class="g">오늘 네 표면 연기 지수 5문항으로 까볼게</span></h1><p class="desc">속마음이랑 다른 얼굴을 계속 만드는 걸 심리학에선 '표면 연기'라고 불러. 오늘 네가 얼마나 그 표정을 지었는지 딱 5문항으로 재보자.</p><div class="src">📎 <b>근거</b> · 감정노동·표면연기(surface acting) 연구: 진짜 감정과 다른 표정 유지가 진짜 웃음보다 심리 소진을 더 키운다는 개념(Hochschild·Grandey)</div><div class="meta"><div class="pill"><b>4</b><span>유형</span></div><div class="pill"><b>5</b><span>문항</span></div><div class="pill"><b>30초</b><span>소요</span></div></div><button class="cta" id="start">내 유형 확인하기</button><p class="fine">심리 이론 기반 · 재미로 보는 해석 · 진단 아님</p></div><div id="quiz" class="scr hidden"><div class="qhead"><button id="back" class="backbtn hidden">← 이전</button><span class="qcount">Q<b id="qn">1</b> / 5</span></div><div class="prog"><i id="bar"></i></div><p class="q" id="qtext"></p><div class="opts" id="opts"></div></div><div id="judging" class="scr hidden"><div class="judge"><div class="spinner"></div><div class="jtext" id="jtext">분석 중…</div></div></div><div id="result" class="scr hidden"></div></div><script>
var D={"questions": [{"q": "방금 누가 안 웃긴 얘길 했어. 네 반응은?", "a": [["그래도 티 안 나게 웃어줌", "A"], ["살짝 입꼬리만 올림", "B"], ["안 웃기면 그냥 무표정", "C"]]}, {"q": "기분 별론데 인사받았어.", "a": [["평소보다 더 밝게 받음", "A"], ["딱 무난하게 받음", "B"], ["톤 그대로, 굳이 안 꾸밈", "D"]]}, {"q": "퇴근길 지금 몸 상태는?", "a": [["이유 없이 방전됨", "A"], ["약간 뻐근하지만 괜찮", "B"], ["멀쩡, 오늘은 편했음", "C"]]}, {"q": "속상한 일 있는 날, 사람들 앞에서 너는?", "a": [["아무 일 없는 척 끝까지 감춤", "A"], ["티 조금 나지만 참음", "B"], ["표정에 다 드러남", "D"]]}, {"q": "혼자 있을 때 네 얼굴은?", "a": [["갑자기 표정이 확 풀림", "A"], ["별 차이 없음", "C"], ["오히려 더 편하고 살아남", "D"]]}], "results": {"A": {"emoji": "🎭", "name": "프로 표면연기자", "tag": "티 하나 안 내는 사람", "desc": "속마음이랑 다른 얼굴을 하루 종일 완벽하게 유지하는 타입이야. 남들은 편해 보이지만 네 배터리는 몰래 새고 있어.", "stat": "표면 연기가 많을수록 진짜 웃음보다 심리 소진·방전감이 크게 나타나(감정노동 연구)", "tips": ["하루 한 번은 아무 표정도 안 짓는 5분 만들기", "'괜찮아' 대신 '지금은 좀 별로'라고 한 명한테만 말해보기"]}, "B": {"emoji": "⚖️", "name": "적당히 조절러", "tag": "낼 만큼만 내는 사람", "desc": "완전 감추지도, 다 드러내지도 않고 균형을 잡는 타입. 소진 위험은 중간이지만 쌓이면 티 안 나게 무너져.", "stat": "연기 강도를 조절하는 사람도 반복되면 피로가 누적된다고 봐", "tips": ["연기 많이 한 날은 스스로 '오늘 애썼다' 인정해주기", "자는 시간만이라도 확실히 지켜 회복량 채우기"]}, "C": {"emoji": "🪨", "name": "무표정 세이버", "tag": "굳이 안 꾸미는 사람", "desc": "안 웃기면 안 웃는, 에너지 아끼는 타입이야. 표정값은 덜 쓰지만 가끔 차가워 보인다는 오해를 받아.", "stat": "표면 연기를 덜 할수록 하루 끝 방전감은 낮은 편", "tips": ["오해 줄이려면 표정 대신 짧은 말로 마음 표현하기", "아낀 에너지, 진짜 좋아하는 데 몰아 쓰기"]}, "D": {"emoji": "🌊", "name": "솔직 표정형", "tag": "얼굴에 다 나오는 사람", "desc": "감정이 그대로 얼굴에 뜨는 타입. 연기 소진은 적은 대신, 안 좋은 날은 티가 나서 상황 관리가 필요해.", "stat": "감정을 억지로 만들지 않는 쪽이 심리 소진은 덜하다는 게 연구 방향"}}, "bridge": "이 유형, 사실 몸 컨디션이랑도 은근 연결돼 있대. 궁금하면 다음 것도 해봐.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t461188", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};
var idx=0,sc={},lock=false,hist=[];
Object.keys(T).forEach(function(k){sc[k]=0});
$("start").onclick=function(){idx=0;hist=[];Object.keys(T).forEach(function(k){sc[k]=0});
$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
$("back").onclick=function(){if(idx<=0||lock)return;idx--;var p=hist.pop();if(p)sc[p.key]--;render(p?p.ai:-1)};
function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;
$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
var qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";qt.textContent=q.q;
var box=$("opts");box.innerHTML="";
q.a.forEach(function(pair,ai){var t=pair[0],k=pair[1];
var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
var choose=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});
b.classList.add("sel");if(sc[k]===undefined)sc[k]=0;sc[k]++;hist.push({key:k,ai:ai});
setTimeout(function(){idx++;idx<Q.length?render(-1):judge()},220)};
var tx,ty,tmoved;
b.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tmoved=false},{passive:true});
b.addEventListener("touchmove",function(e){var t=e.changedTouches[0];if(Math.abs(t.clientX-tx)>12||Math.abs(t.clientY-ty)>12)tmoved=true},{passive:true});
b.addEventListener("touchend",function(e){if(!tmoved){e.preventDefault();choose()}});
b.addEventListener("click",function(){if(tx==null)choose()});box.appendChild(b)})}
function judge(){$("quiz").classList.add("hidden");$("judging").classList.remove("hidden");$("bar").style.width="100%";
var steps=["증상 접수 중…","심리 이론 대조 중…","패턴 매칭 중…","맞춤 리포트 작성 중…"];var si=0;$("jtext").textContent=steps[0];
var iv=setInterval(function(){si++;if(si<steps.length){$("jtext").textContent=steps[si]}else{clearInterval(iv);show()}},540)}
function show(){var code=Object.keys(sc).reduce(function(a,b){return sc[a]>=sc[b]?a:b});
var t=T[code]||T[Object.keys(T)[0]];
var tipHtml=(t.tips||[]).map(function(x){return '<div class="li">'+x+'</div>'}).join("");
$("result").innerHTML='<div class="rwrap"><div class="rcard"><div class="rin">'
+'<div class="remoji">'+(t.emoji||"🔎")+'</div><div class="rtype">YOUR TYPE</div>'
+'<div class="rname"><span class="em">'+t.name+'</span></div>'
+'<div class="rbase">'+(t.tag||"")+'</div><div class="rdesc">'+t.desc+'</div>'
+(t.stat?'<div class="src" style="margin-top:14px">'+t.stat+'</div>':'')
+'</div></div><div class="hint">📸 내 유형 맞으면 캡처해서 공유</div>'
+(tipHtml?'<div class="sec"><h3>💡 이 유형, 이렇게</h3>'+tipHtml+'</div>':'')
+'<div class="social"><div class="top">🔗 근데 이거 알아?</div>'
+'<div class="sub" style="margin-top:8px">'+D.bridge+'</div></div>'
+'<div class="btns"><a class="gbtn pri" href="'+D.next+'">'+D.next_label+' →</a>'
+'<button class="gbtn sec2" onclick="location.reload()">다시 하기</button></div>'
+'<footer>근거: 심리 이론 기반 해석 · 의학 진단 아님 · 결과 저장 안 됨</footer></div>';
$("judging").classList.add("hidden");$("result").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
</script></body></html>
