<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>우리 부부 소통 유형 테스트</title><meta property="og:title" content="남편이 시댁 편들 때, 사실은 '소통 방식' 문제일 수도"><meta property="og:description" content="성격 차이 아니라 말하는 방식 차이. 내 소통 유형 5문항으로 확인해봐"><meta property="og:image" content="https://airgoods-oss.github.io/haru/og_t920870.png"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><style>@font-face{font-family:'Pretendard';src:url('Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('Pretendard-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Pretendard';src:url('Pretendard-Bold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{--bg:#0B1212;--surface:#121B1B;--surface2:#182525;--line:#243838;--ink:#EAF4F2;--sub:#9AB8B3;--faint:#5E7A76;--teal:#2FC7A8;--teal2:#6EE7C8;--amber:#F5B23C;--grad:linear-gradient(135deg,#2FC7A8 0%,#5B8DEF 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,sans-serif;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 22px 60px;position:relative}
.app::before{content:"";position:fixed;top:-15%;left:50%;transform:translateX(-50%);width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(47,199,168,.2),transparent 62%);filter:blur(30px)}
.scr{position:relative;z-index:1}.hidden{display:none!important}
.eyebrow{display:inline-flex;align-items:center;gap:7px;margin-top:52px;font-size:12.5px;font-weight:600;color:var(--teal2);background:rgba(47,199,168,.12);border:1px solid rgba(47,199,168,.28);padding:7px 13px;border-radius:99px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.35}}
h1{font-weight:800;font-size:36px;line-height:1.22;letter-spacing:-.03em;margin:20px 0 0}

.src{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--sub);line-height:1.75}.src b{color:var(--teal2)}
.meta{display:flex;gap:8px;margin-top:16px}

.pill b{display:block;font-weight:800;font-size:18px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.pill span{font-size:12px;color:var(--faint)}
.cta{position:relative;overflow:hidden;display:block;width:100%;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:17px;color:#08201b;background:var(--grad);border-radius:16px;padding:18px;margin-top:24px;box-shadow:0 10px 30px -8px rgba(47,199,168,.5);transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}@keyframes shine{0%{left:-60%}60%,100%{left:130%}}

.q{font-weight:800;font-size:21px;line-height:1.44;letter-spacing:-.02em;margin:32px 0 22px;min-height:88px;animation:qin .4s cubic-bezier(.2,.7,.2,1)}@keyframes qin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:11px}

.opt.sel .ic{border-color:var(--teal);background:var(--teal);box-shadow:0 0 0 4px rgba(47,199,168,.2)}
.judge{text-align:center;padding-top:120px}
.spinner{width:60px;height:60px;margin:0 auto 22px;border-radius:50%;border:5px solid var(--surface2);border-top-color:var(--teal);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.jtext{font-weight:800;font-size:18px}
.rwrap{padding-top:34px;animation:rin .5s cubic-bezier(.2,.7,.2,1)}@keyframes rin{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.rcard{border-radius:24px;padding:2px;background:var(--grad);box-shadow:0 20px 50px -16px rgba(47,199,168,.5)}

.remoji{font-size:54px;line-height:1}.rtype{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.08em;margin-top:10px}
.rname{font-weight:800;font-size:25px;letter-spacing:-.02em;margin-top:3px}.rname .em{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rbase{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;color:var(--amber);background:rgba(245,178,60,.12);border:1px solid rgba(245,178,60,.25);padding:5px 12px;border-radius:99px}
.rdesc{color:var(--sub);font-size:14.5px;line-height:1.74;margin-top:16px;text-align:left}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:12px;text-align:left}
.sec h3{margin:0 0 9px;font-size:13px;font-weight:800;color:var(--amber)}
.sec .li{font-size:14px;color:var(--sub);line-height:1.7;padding-left:16px;position:relative;margin-top:7px}.sec .li::before{content:"·";position:absolute;left:4px;color:var(--teal)}
.hint{text-align:center;color:var(--faint);font-size:13px;margin-top:18px}
.social{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-top:16px}
.social .top{font-size:12.5px;color:var(--teal2);font-weight:700}
.bignum{font-weight:800;font-size:30px;letter-spacing:-.02em;margin:8px 0 2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.social .sub{font-size:13.5px;color:var(--sub);line-height:1.7}.social .sub b{color:var(--ink)}
.review{background:var(--surface);border-radius:12px;padding:13px 15px;margin-top:12px;font-size:13.5px;color:var(--ink);line-height:1.65}.review .who{display:block;margin-top:6px;font-size:11.5px;color:var(--faint)}
.stars{color:var(--amber);font-size:13px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.gbtn{display:block;text-align:center;text-decoration:none;font-family:inherit;font-weight:800;font-size:15.5px;border-radius:15px;padding:16px;cursor:pointer;border:0}
.gbtn.pri{background:var(--grad);color:#08201b;box-shadow:0 10px 28px -10px rgba(47,199,168,.5)}
.gbtn.sec2{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.reassure{text-align:center;font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6}
footer{color:var(--faint);font-size:11px;line-height:1.7;margin:26px 0 20px;text-align:center}</style></head><body><div class="app"><div id="intro" class="scr"><div class="eyebrow"><span class="dot"></span>AI 심리 분석소</div><h1>성격이 안 맞는 게 아니라 '말하는 방식'이 안 맞는 거라면?<br><span class="g">시댁 얘기만 나오면 벽 느껴지는 이유, 5문항으로 확인해봐</span></h1><p class="desc">싸움의 원인은 내용보다 '방식'인 경우가 많대. 네가 갈등에서 어떻게 말하는 사람인지 딱 5문항으로 알아보자.</p><div class="src">📎 <b>근거</b> · 통계청 이혼사유 1위는 '성격차이'지만, 부부상담에선 그 상당수가 소통 방식 불일치로 봐</div><div class="meta"><div class="pill"><b>4</b><span>유형</span></div><div class="pill"><b>5</b><span>문항</span></div><div class="pill"><b>30초</b><span>소요</span></div></div><button class="cta" id="start">내 유형 확인하기</button><p class="fine">심리 이론 기반 · 재미로 보는 해석 · 진단 아님</p></div><div id="quiz" class="scr hidden"><div class="qhead"><button id="back" class="backbtn hidden">← 이전</button><span class="qcount">Q<b id="qn">1</b> / 5</span></div><div class="prog"><i id="bar"></i></div><p class="q" id="qtext"></p><div class="opts" id="opts"></div></div><div id="judging" class="scr hidden"><div class="judge"><div class="spinner"></div><div class="jtext" id="jtext">분석 중…</div></div></div><div id="result" class="scr hidden"></div></div><script>
var D={"questions": [{"q": "남편이 시댁 편을 들 때 너의 첫 반응은?", "a": [["일단 서운함부터 터뜨린다", "A"], ["말문 닫고 방으로 들어간다", "B"], ["왜 그러는지 논리로 따진다", "C"]]}, {"q": "싸우고 난 뒤 너는?", "a": [["감정이 안 풀리면 계속 얘기하자고 한다", "A"], ["혼자 삭이며 시간이 지나길 기다린다", "B"], ["누가 잘못했는지 정리부터 하고 싶다", "C"]]}, {"q": "상대가 내 맘을 몰라줄 때?", "a": [["'너 진짜 너무해' 하고 표현한다", "A"], ["'됐어, 말해 뭐해' 하고 접는다", "B"], ["'아까 네가 이렇게 말했잖아' 근거를 든다", "C"]]}, {"q": "대화가 막히면 너는?", "a": [["목소리가 커지고 눈물이 난다", "A"], ["대답이 짧아지고 자리를 뜬다", "B"], ["팩트랑 순서를 다시 짚는다", "C"]]}, {"q": "화해할 때 너의 방식은?", "a": [["안아주거나 마음을 다 쏟아낸다", "A"], ["아무 일 없던 듯 밥부터 차린다", "B"], ["뭐가 문제였는지 규칙을 정하자 한다", "C"]]}], "results": {"A": {"emoji": "🌊", "name": "감정 직진형", "tag": "마음을 먼저 쏟아내는 사람", "desc": "느낀 걸 바로 표현해 진심이 빠르게 닿지만, 상대는 '공격받았다'고 느끼기 쉬워. 감정이 앞서면 내용이 묻혀버려.", "stat": "감정을 즉시 표현하는 사람은 오해는 적지만 상대의 방어를 부르기 쉽다고 해", "tips": ["터뜨리기 전 '나는 ~해서 서운해' 나-전달법으로 바꿔보기", "말하기 전 3초, 감정 이름부터 붙여보기"]}, "B": {"emoji": "🐢", "name": "회피 잠수형", "tag": "일단 닫고 삭이는 사람", "desc": "싸움을 키우지 않으려 입을 닫지만, 상대는 '무시당했다'고 느껴. 삭인 감정은 사라지는 게 아니라 쌓여.", "stat": "갈등 회피(스톤월링)는 관계 만족도를 가장 크게 떨어뜨리는 패턴 중 하나로 꼽혀", "tips": ["'지금은 말 못하겠어, 30분 뒤에 얘기하자' 예고하고 잠수하기", "닫기 전에 딱 한 문장, 내 상태만 말해주기"]}, "C": {"emoji": "⚖️", "name": "논리 정리형", "tag": "팩트부터 짚는 사람", "desc": "문제를 차분히 분석해 해결엔 강하지만, 상대는 '재판받는 기분'이 들 수 있어. 옳은 말이 늘 통하는 건 아니야.", "stat": "갈등 중 '누가 옳은가'보다 '어떻게 느끼는가'를 먼저 다룰수록 화해가 빠르다고 해", "tips": ["해결책보다 '그랬구나' 공감 한마디 먼저 얹기", "팩트 정리 전에 상대 감정부터 물어보기"]}, "D": {"emoji": "🌱", "name": "균형 조율형", "tag": "감정과 논리를 오가는 사람", "desc": "상황 따라 표현과 정리를 유연하게 쓰는 편이라 갈등을 잘 풀어. 다만 상대에 맞추다 네 감정을 미루기도 해.", "stat": "감정 표현과 문제 해결을 상황에 맞게 전환하는 사람이 관계 안정도가 높은 편이야"}}, "bridge": "이 유형, 사실 몸 컨디션이랑도 은근 연결돼 있대. 궁금하면 다음 것도 해봐.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t920870", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};
var idx=0,sc={},lock=false,hist=[];
Object.keys(T).forEach(function(k){sc[k]=0});
$("start").onclick=function(){idx=0;hist=[];Object.keys(T).forEach(function(k){sc[k]=0});
$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
$("back").onclick=function(){if(idx<=0||lock)return;idx--;var p=hist.pop();if(p)sc[p.key]--;render(p?p.ai:-1)};
function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;
$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);
var qt=$("qtext");qt.style.animation="none";void qt.offsetWidth;qt.style.animation="";qt.textContent=q.q;
var box=$("opts");box.innerHTML="";
q.a.forEach(function(pair,ai){var t=pair[0],k=pair[1];
var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
b.onclick=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});
b.classList.add("sel");if(sc[k]===undefined)sc[k]=0;sc[k]++;hist.push({key:k,ai:ai});
setTimeout(function(){idx++;idx<Q.length?render(-1):judge()},260)};box.appendChild(b)})}
function judge(){$("quiz").classList.add("hidden");$("judging").classList.remove("hidden");$("bar").style.width="100%";
var steps=["증상 접수 중…","심리 이론 대조 중…","패턴 매칭 중…","맞춤 리포트 작성 중…"];var si=0;$("jtext").textContent=steps[0];
var iv=setInterval(function(){si++;if(si<steps.length){$("jtext").textContent=steps[si]}else{clearInterval(iv);show()}},540)}
function show(){var code=Object.keys(sc).reduce(function(a,b){return sc[a]>=sc[b]?a:b});
var t=T[code]||T[Object.keys(T)[0]];
var tipHtml=(t.tips||[]).map(function(x){return '<div class="li">'+x+'</div>'}).join("");
$("result").innerHTML='<div class="rwrap"><div class="rcard"><div class="rin">'
+'<div class="remoji">'+(t.emoji||"🔎")+'</div><div class="rtype">YOUR TYPE</div>'
+'<div class="rname"><span class="em">'+t.name+'</span></div>'
+'<div class="rbase">'+(t.tag||"")+'</div><div class="rdesc">'+t.desc+'</div>'
+(t.stat?'<div class="src" style="margin-top:14px">'+t.stat+'</div>':'')
+'</div></div><div class="hint">📸 내 유형 맞으면 캡처해서 공유</div>'
+(tipHtml?'<div class="sec"><h3>💡 이 유형, 이렇게</h3>'+tipHtml+'</div>':'')
+'<div class="social"><div class="top">🔗 근데 이거 알아?</div>'
+'<div class="sub" style="margin-top:8px">'+D.bridge+'</div></div>'
+'<div class="btns"><a class="gbtn pri" href="'+D.next+'">'+D.next_label+' →</a>'
+'<button class="gbtn sec2" onclick="location.reload()">다시 하기</button></div>'
+'<footer>근거: 심리 이론 기반 해석 · 의학 진단 아님 · 결과 저장 안 됨</footer></div>';
$("judging").classList.add("hidden");$("result").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
</script></body></html>
