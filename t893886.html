, "tips": ["괜찮아도 '나 지금 이런 마음이야' 한 번씩 나눠주기", "상대가 다가올 때 살짝만 문을 더 열어두기"]}, "D": {"emoji": "🦔", "name": "밀당하는 고슴도치형", "tag": "양가형 · 상위 27%", "desc": "넌 다가가고 싶은 마음과 지기 싫은 마음이 동시에 사는 사람이야. 붙잡아주길 바라면서도 먼저 물러서고, 그 사이에서 혼자 마음이 복잡해지지. 가시 안쪽엔 사실 제일 따뜻한 게 숨어 있어.", "stat": "다가감과 물러남이 반복되는 성향은 감정 기복과 몸의 긴장을 함께 키우기 쉽다(불안-회피 혼재 특성)."}}, "bridge": "이 유형, 사실 몸 컨디션이랑도 은근 연결돼 있대. 궁금하면 다음 것도 해봐.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t893886", "next_label": "그럼 내 몸 상태는? 30초 진단"};var Q=D.questions,T=D.results;
