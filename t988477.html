복, 사실 요즘 네 몸 컨디션·스트레스 상태랑 은근히 연결돼 있다는 거 알아?", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=t988477", "next_label": "내 몸·스트레스 유형은? 30초 체크"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};
var idx=0,sc={},lock=false,hist=[];

$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};

function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;

if(ai===prevAi)b.classList.add("sel");
