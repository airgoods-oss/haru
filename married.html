var D={"questions": [{"q": "소개팅 전, 딱 하나만 미리 볼 수 있다면?", "a": [["얼굴 사진", "A"], ["직업·연봉", "B"], ["대화 스타일", "C"], ["가정환경·가치관", "D"]]}, {"q": "'이건 도저히 안 되겠다' 마음 접는 순간은?", "a": [["외모가 영 안 끌릴 때", "A"], ["미래가 안 그려질 때(능력)", "B"], ["말이 하나도 안 통할 때", "C"], ["인생관이 정반대일 때", "D"]]}, {"q": "친구가 남자 소개해준다며 제일 먼저 하는 질문?", "a": [["사진 있어? 키 몇이야?", "A"], ["뭐 하는 사람이야?", "B"], ["성격 어때? 재밌어?", "C"], ["어떤 사람이야? 진지해?", "D"]]}, {"q": "10년 살아보니 결혼에서 제일 중요한 건?", "a": [["설렘·끌림이 남아있는 것", "A"], ["경제적으로 안정된 것", "B"], ["말 통하고 안 싸우는 것", "C"], ["같은 곳을 보고 사는 것", "D"]]}, {"q": "돈 많고 무심한 남자 vs 가난해도 다정한 남자?", "a": [["잘생겼으면 둘 다 고민", "A"], ["돈 많은 쪽. 현실은 돈", "B"], ["무조건 다정한 쪽", "C"], ["나랑 맞는 사람이면 돈은 나중", "D"]]}, {"q": "결혼정보회사 간다면 1순위 조건칸에 뭘 적어?", "a": [["외모·키", "A"], ["연봉·직업·집안", "B"], ["성격·유머", "C"], ["가치관·종교·신뢰", "D"]]}], "results": {"A": {"emoji": "😍", "name": "비주얼 직진형", "tag": "외모 우선 · 상위 18%", "desc": "끌림이 먼저인 솔직한 타입. 통계상 '남자에 가까운' 성향인데, 이런 여자가 의외로 연애를 제일 뜨겁게 하고 후회도 없어. 다만 콩깍지 벗겨진 뒤가 진짜 시작이야.", "stat": "외모 선호는 남성에서 강하게 나타나지만, 여성 소수도 뚜렷이 존재한다고 해", "tips": ["끌림 다음에 '대화가 되는지'를 꼭 한 번 더 확인하기", "외모는 적응돼. 3개월 뒤에도 설레는지를 기준으로"]}, "B": {"emoji": "💎", "name": "조건 안정형", "tag": "능력 우선 · 상위 27%", "desc": "능력·현실이 먼저인 지혜로운 타입. 사랑도 좋지만 결혼은 생활이라는 걸 아는 사람. 냉정한 게 아니라 계산이 빠른 거야. 단, 숫자만 보면 정작 사람을 놓쳐.", "stat": "경제력 선호는 결혼을 '생활 공동체'로 볼수록 높아지는 현실적 지표", "tips": ["조건 체크리스트 옆에 '이 사람과 밥 먹는 게 편한가' 한 칸 추가하기", "안정은 통장만이 아니라 '싸운 뒤 태도'에서도 와"]}, "C": {"emoji": "💬", "name": "소울메이트형", "tag": "성격 우선 · 상위 34%", "desc": "대화·성격이 먼저인 가장 흔한 여성 유형(통계상 71%). 평생 말 통하는 사람을 찾는 타입. 권태기에 제일 강하지만, '착한데 심심한' 사람과 헷갈리면 안 돼.", "stat": "여성의 배우자 선호에서 성격·정서적 소통은 가장 높은 비중을 차지한다고 해", "tips": ["'대화가 되는 것'과 '나한테 맞춰주는 것'을 구분하기", "성격 좋음 = 무난함이 아니야. 갈등을 어떻게 푸는지를 보기"]}, "D": {"emoji": "🧭", "name": "가치관 동맹형", "tag": "가치관 우선 · 상위 9%", "desc": "인생관·신뢰가 먼저인 드문 타입. 돈·얼굴보다 '같은 방향 보는 사람'을 찾아. 결혼 만족도는 최상위지만, 그런 사람 만나기가 제일 어려워서 눈이 높다는 오해를 받아.", "stat": "가치관 일치도는 장기 결혼만족도를 가장 잘 예측하는 요인 중 하나로 꼽혀", "tips": ["가치관은 말이 아니라 '돈 쓸 때·싸울 때' 행동에서 드러나. 그때 관찰하기", "눈이 높은 게 아니라 기준이 명확한 것 — 조급해하지 말기"]}}, "bridge": "근데 이 '뭘 우선하냐'가 사실 지금 네 몸·스트레스 상태랑도 연결돼 있대. 지칠수록 판단 기준이 바뀌거든.", "next": "https://airgoods-oss.github.io/haru/body.html?nt_source=threads&nt_medium=social&nt_detail=married", "next_label": "내 몸·스트레스 유형은? 30초 체크"};var Q=D.questions,T=D.results;
var $=function(id){return document.getElementById(id)};
var idx=0,sc={},lock=false,hist=[];
Object.keys(T).forEach(function(k){sc[k]=0});
$("start").onclick=function(){idx=0;hist=[];Object.keys(T).forEach(function(k){sc[k]=0});
$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render(-1)};
$("back").onclick=function(){if(idx<=0||lock)return;idx--;var p=hist.pop();if(p)sc[p.key]--;render(p?p.ai:-1)};
function render(prevAi){var q=Q[idx];lock=false;$("qn").textContent=idx+1;
$("bar").style.width=(idx/Q.length*100)+"%";$("back").classList.toggle("hidden",idx===0);

q.a.forEach(function(pair,ai){var t=pair[0],k=pair[1];
var b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ic"></span>'+t;
if(ai===prevAi)b.classList.add("sel");
var choose=function(){if(lock)return;lock=true;
box.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});
b.classList.add("sel");if(sc[k]===undefined)sc[k]=0;sc[k]++;hist.push({key:k,ai:ai});
